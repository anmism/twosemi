name: Windows package

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Create packages
        shell: pwsh
        run: |
          $version = "0.1.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          cpack --config build\CPackConfig.cmake -G ZIP -B dist `
            -D "CPACK_PACKAGE_VERSION=$version" `
            -D "CPACK_PACKAGE_FILE_NAME=TwoSemi-$version-win64"
          cpack --config build\CPackConfig.cmake -G NSIS -B dist `
            -D "CPACK_PACKAGE_VERSION=$version" `
            -D "CPACK_PACKAGE_FILE_NAME=TwoSemi-$version-win64"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TwoSemi-windows
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @files --generate-notes --title "TwoSemi $env:GITHUB_REF_NAME"
